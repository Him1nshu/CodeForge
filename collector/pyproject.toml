[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildpulse-collector"
version = "0.1.0"
description = "BuildPulse collector CLI — analyze a C++ build and upload a build_report.json"
requires-python = ">=3.11"

[project.scripts]
buildpulse = "buildpulse.cli:main"

[tool.setuptools.packages.find]
include = ["buildpulse*"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"